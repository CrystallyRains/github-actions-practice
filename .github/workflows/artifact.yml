name: Upload Artifact

on:
  workflow_dispatch:

jobs:
  artifact-test:
    runs-on: ubuntu-latest

    steps:
      - name: Generate test report
        run: |
          echo "GitHub Actions Test Report" > test-report.txt
          echo "Workflow completed successfully." >> test-report.txt
          echo "Artifact generated during CI." >> test-report.txt

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.txt

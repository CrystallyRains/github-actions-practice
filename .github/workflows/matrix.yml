name: Python Matrix

on:
  push:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print Python version
        run: |
          python --version

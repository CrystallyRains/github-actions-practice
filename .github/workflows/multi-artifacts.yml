name: Artifacts Between Jobs

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate file
        run: |
          echo "This file was generated by Job 1." > build-info.txt
          echo "Artifact transfer between jobs works!" >> build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt

  consume:
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: build-info

      - name: Read artifact
        run: cat build-info.txt

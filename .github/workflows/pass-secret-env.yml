name: Use Secrets as Environment Variables

on:
  workflow_dispatch:

jobs:
  secret-test:
    runs-on: ubuntu-latest

    steps:
      - name: Use Docker credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          echo "Docker username is set: ${{ env.DOCKER_USERNAME != '' }}"
          echo "Docker token is set: ${{ env.DOCKER_TOKEN != '' }}"
